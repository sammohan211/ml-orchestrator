[project]
name = "ml-orchestrator"
version = "0.1.0"
description = "Terminal-based ML workflow helper for tabular data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.5.3",
    "pandas>=3.0.2",
    "plotext>=5.3.2",
    "pyarrow>=23.0.1",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "rich>=14.3.3",
    "scikit-learn>=1.8.0",
    "typer>=0.24.1",
]

[project.scripts]
mlo = "ml_orchestrator.main:app"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.9",
]
