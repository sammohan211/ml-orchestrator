# Canonical Project State Schema
# ML-Orchestrator v1.0
#
# This file shows a fully completed workflow state using a customer churn
# classification dataset as the example. All paths are relative to project_dir
# so the project directory is portable.
#
# Design rules:
#   - Paths are relative to project_dir (portability)
#   - Each stage records completed_at (resume logic knows what's done)
#   - problem_type_source distinguishes inferred vs user override (transparency)
#   - Artifact paths appear in the stage that produced them AND in the top-level
#     artifacts index (stages own what they produced; artifacts is a quick lookup)
#   - Model registry module path is stored so the correct class can be re-instantiated
#   - Nothing that requires loading a file is stored in state (no dataframes, no models)

# ---------------------------------------------------------------------------
# Project Metadata
# ---------------------------------------------------------------------------
project:
  name: customer_churn_analysis
  project_dir: /home/sam/ml_projects/customer_churn_analysis
  created_at: "2026-04-03T10:15:00"
  last_updated: "2026-04-03T14:32:00"
  schema_version: "1.0"

# ---------------------------------------------------------------------------
# Settings
# Presented to the user at project creation and editable via Settings menu.
# All stages read from here — config/defaults.py is only the fallback.
# ---------------------------------------------------------------------------
settings:
  # Feature preparation
  test_size: 0.2
  random_seed: 42
  stratified: true          # classification only; ignored for regression

  # Feature selection
  feature_selection_threshold: 0.01   # minimum importance score to retain a feature

  # Hyperparameter tuning
  cv_folds: 5
  tuning_n_iter: 20         # number of iterations for RandomizedSearchCV

  # Profiling
  high_cardinality_threshold: 50      # unique values above this triggers a warning
  class_imbalance_threshold: 0.75     # majority class above this triggers a warning

# ---------------------------------------------------------------------------
# Stage Completion Status
# Used by the menu to show progress and enforce soft ordering warnings.
# Values: pending | completed | skipped
# ---------------------------------------------------------------------------
stages:
  ingestion: completed
  profiling: completed
  cleaning: completed
  feature_preparation: completed
  feature_selection: completed
  modeling: completed
  tuning: completed
  evaluation: completed
  export: completed

# ---------------------------------------------------------------------------
# Data Ingestion
# ---------------------------------------------------------------------------
ingestion:
  completed_at: "2026-04-03T10:18:00"
  source_path: /home/sam/data/churn.csv   # absolute — original source, not moved
  format: csv
  row_count: 7043
  column_count: 21
  schema:
    CustomerID:      { dtype: object,  nullable: false }
    gender:          { dtype: object,  nullable: false }
    SeniorCitizen:   { dtype: int64,   nullable: false }
    Partner:         { dtype: object,  nullable: false }
    Dependents:      { dtype: object,  nullable: false }
    tenure:          { dtype: int64,   nullable: false }
    PhoneService:    { dtype: object,  nullable: false }
    MultipleLines:   { dtype: object,  nullable: false }
    InternetService: { dtype: object,  nullable: false }
    OnlineSecurity:  { dtype: object,  nullable: false }
    OnlineBackup:    { dtype: object,  nullable: false }
    DeviceProtection:{ dtype: object,  nullable: false }
    TechSupport:     { dtype: object,  nullable: false }
    StreamingTV:     { dtype: object,  nullable: false }
    StreamingMovies: { dtype: object,  nullable: false }
    Contract:        { dtype: object,  nullable: false }
    PaperlessBilling:{ dtype: object,  nullable: false }
    PaymentMethod:   { dtype: object,  nullable: false }
    MonthlyCharges:  { dtype: float64, nullable: false }
    TotalCharges:    { dtype: object,  nullable: true  }  # mixed type at load
    Churn:           { dtype: object,  nullable: false }

# ---------------------------------------------------------------------------
# Profiling
# ---------------------------------------------------------------------------
profiling:
  completed_at: "2026-04-03T10:22:00"
  row_count: 7043
  duplicate_rows: 0
  null_counts:
    TotalCharges: 11
    # all other columns: 0 (omitted for brevity — full list in profiling_summary.json)
  warnings:
    - { type: id_like_column,    column: CustomerID,    detail: "unique count equals row count" }
    - { type: high_null_rate,    column: TotalCharges,  detail: "11 nulls (0.16%)" }
    - { type: mixed_type_column, column: TotalCharges,  detail: "loaded as object, likely numeric" }
    - { type: class_imbalance,   column: Churn,         detail: "No: 73.5%, Yes: 26.5%" }
  artifacts:
    json_summary: artifacts/profiling_summary.json
    html_report:  artifacts/profiling_report.html     # generated by ydata-profiling

# ---------------------------------------------------------------------------
# Cleaning
# ---------------------------------------------------------------------------
cleaning:
  completed_at: "2026-04-03T10:35:00"
  actions:
    - { type: exclude_column,   column: CustomerID,   reason: "id-like, excluded from modeling" }
    - { type: cast_column,      column: TotalCharges, to_dtype: float64 }
    - { type: impute,           column: TotalCharges, strategy: median }
    - { type: remove_duplicates, rows_removed: 0 }
  excluded_columns:
    - CustomerID
  artifacts:
    cleaned_dataset: artifacts/cleaned_dataset.csv

# ---------------------------------------------------------------------------
# Feature Preparation
# ---------------------------------------------------------------------------
feature_preparation:
  completed_at: "2026-04-03T10:42:00"
  target_column: Churn
  problem_type: classification
  problem_type_source: inferred     # "inferred" | "user_override"
  split:
    test_size: 0.2
    random_seed: 42
    stratified: true
    train_rows: 5634
    test_rows: 1409
  encoding:
    gender:          { strategy: one_hot,  source: recommended }
    Partner:         { strategy: one_hot,  source: recommended }
    Dependents:      { strategy: one_hot,  source: recommended }
    PhoneService:    { strategy: one_hot,  source: recommended }
    MultipleLines:   { strategy: one_hot,  source: recommended }
    InternetService: { strategy: one_hot,  source: recommended }
    OnlineSecurity:  { strategy: one_hot,  source: recommended }
    OnlineBackup:    { strategy: one_hot,  source: recommended }
    DeviceProtection:{ strategy: one_hot,  source: recommended }
    TechSupport:     { strategy: one_hot,  source: recommended }
    StreamingTV:     { strategy: one_hot,  source: recommended }
    StreamingMovies: { strategy: one_hot,  source: recommended }
    Contract:        { strategy: one_hot,  source: recommended }
    PaperlessBilling:{ strategy: one_hot,  source: recommended }
    PaymentMethod:   { strategy: one_hot,  source: recommended }
  scaling:
    SeniorCitizen:   { strategy: standard, source: recommended }
    tenure:          { strategy: standard, source: recommended }
    MonthlyCharges:  { strategy: standard, source: recommended }
    TotalCharges:    { strategy: standard, source: recommended }
  # source: "recommended" | "user_override" — tracks whether user accepted or changed the suggestion

# ---------------------------------------------------------------------------
# Feature Selection
# ---------------------------------------------------------------------------
feature_selection:
  completed_at: "2026-04-03T10:48:00"
  method: model_based_importance
  method_params:
    estimator: RandomForestClassifier
    n_estimators: 50
    random_state: 42
    threshold: 0.01       # features below this importance score removed
  selected_features:
    - tenure
    - MonthlyCharges
    - TotalCharges
    - Contract_Month-to-month
    - Contract_Two-year
    - PaymentMethod_Electronic-check
    - InternetService_Fiber-optic
    - OnlineSecurity_No
    - TechSupport_No
  removed_features:
    - gender_Female
    - gender_Male
    - PhoneService_No
    - PhoneService_Yes
    - Partner_No
    - Partner_Yes
  feature_scores:
    tenure: 0.187
    MonthlyCharges: 0.163
    TotalCharges: 0.141
    Contract_Month-to-month: 0.098
    Contract_Two-year: 0.071
    PaymentMethod_Electronic-check: 0.054
    InternetService_Fiber-optic: 0.041
    OnlineSecurity_No: 0.038
    TechSupport_No: 0.031
    gender_Female: 0.008
    gender_Male: 0.007
    PhoneService_No: 0.006
    PhoneService_Yes: 0.006
    Partner_No: 0.005
    Partner_Yes: 0.004

# ---------------------------------------------------------------------------
# Modeling (Baseline)
# ---------------------------------------------------------------------------
modeling:
  completed_at: "2026-04-03T11:02:00"
  model_name: RandomForestClassifier
  model_module: models.classification.random_forest   # registry path for re-instantiation
  params:
    n_estimators: 100
    max_depth: null
    min_samples_split: 2
    random_state: 42
  artifacts:
    model: artifacts/model.joblib

# ---------------------------------------------------------------------------
# Hyperparameter Tuning
# ---------------------------------------------------------------------------
tuning:
  completed_at: "2026-04-03T11:18:00"
  search_type: RandomizedSearchCV
  cv_folds: 5
  scoring_metric: f1_weighted
  n_iter: 20
  param_grid:
    n_estimators: [100, 200, 300]
    max_depth: [5, 10, 20, null]
    min_samples_split: [2, 5, 10]
    min_samples_leaf: [1, 2, 4]
  best_params:
    n_estimators: 200
    max_depth: 10
    min_samples_split: 5
    min_samples_leaf: 2
  baseline_cv_score: 0.791
  tuned_cv_score: 0.812
  artifacts:
    model_tuned: artifacts/model_tuned.joblib

# ---------------------------------------------------------------------------
# Evaluation
# Note: evaluation always runs against the test split, never the training split.
# model_used records which model was evaluated so this is unambiguous on reload.
# ---------------------------------------------------------------------------
evaluation:
  completed_at: "2026-04-03T11:25:00"
  model_used: tuned                   # "baseline" | "tuned"
  metrics:
    accuracy: 0.814
    precision_weighted: 0.809
    recall_weighted: 0.814
    f1_weighted: 0.811
    roc_auc: 0.847
  confusion_matrix:
    labels: ["No", "Yes"]
    matrix: [[1021, 32], [131, 225]]
  artifacts:
    evaluation_summary: artifacts/evaluation_summary.json
    html_report:        artifacts/evaluation_report.html

# ---------------------------------------------------------------------------
# Artifact Index
# Flat lookup of all artifacts across all stages.
# Stages write to their own artifacts block; this is a convenience index.
# ---------------------------------------------------------------------------
artifacts:
  cleaned_dataset:    artifacts/cleaned_dataset.csv
  profiling_summary:  artifacts/profiling_summary.json
  profiling_report:   artifacts/profiling_report.html
  feature_list:       artifacts/features.txt
  model:              artifacts/model.joblib
  model_tuned:        artifacts/model_tuned.joblib
  evaluation_summary: artifacts/evaluation_summary.json
  evaluation_report:  artifacts/evaluation_report.html
  workflow_config:    artifacts/workflow_config.yaml
  pipeline:           artifacts/pipeline.joblib   # sklearn Pipeline: preprocessing + model
  run_log:            artifacts/run.log

# ---------------------------------------------------------------------------
# Dependency Log
# ---------------------------------------------------------------------------
dependencies:
  - { package: pyarrow,         action: already_present, version: "14.0.1", at: "2026-04-03T10:17:00" }
  - { package: ydata-profiling, action: installed,       version: "4.6.0",  at: "2026-04-03T10:20:00" }
